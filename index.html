<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Convertisseur Facebook</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            font-family: Arial, sans-serif;

            background: #0f172a;
            color: white;
        }

        .container {
            width: 100%;
            max-width: 650px;

            background: #1e293b;

            padding: 25px;

            border-radius: 20px;

            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        h1 {
            margin-top: 0;
            text-align: center;
        }

        .description {
            text-align: center;
            color: #cbd5e1;
            margin-bottom: 25px;
        }

        input {
            width: 100%;

            padding: 16px;

            border-radius: 12px;
            border: 1px solid #475569;

            background: #0f172a;
            color: white;

            font-size: 16px;

            outline: none;
        }

        input:focus {
            border-color: #1877f2;
        }

        button {
            width: 100%;

            margin-top: 12px;

            padding: 15px;

            border: none;
            border-radius: 12px;

            background: #1877f2;
            color: white;

            font-size: 16px;
            font-weight: bold;

            cursor: pointer;
        }

        button:active {
            transform: scale(0.98);
        }

        #result {
            display: none;

            margin-top: 20px;

            padding: 15px;

            background: #0f172a;

            border-radius: 12px;

            word-break: break-all;
        }

        .result-title {
            font-weight: bold;
            margin-bottom: 10px;
        }

        .link {
            color: #60a5fa;
            font-size: 15px;
        }

        .copy {
            background: #16a34a;
        }

        .open {
            background: #475569;
        }

        .error {
            color: #f87171;
        }

        .loading {
            text-align: center;
            color: #cbd5e1;
        }

        .footer {
            margin-top: 20px;

            text-align: center;

            color: #94a3b8;

            font-size: 12px;
        }
    </style>

</head>

<body>

<div class="container">

    <h1>
        Convertisseur Facebook
    </h1>

    <div class="description">
        Colle un lien Facebook de partage pour récupérer son lien permanent.
    </div>

    <input
        id="url"
        type="url"
        placeholder="https://www.facebook.com/share/..."
    >

    <button onclick="convertir()">
        Convertir
    </button>


    <div id="result">

        <div
            id="resultTitle"
            class="result-title">
        </div>

        <div
            id="finalLink"
            class="link">
        </div>

        <button
            id="copyButton"
            class="copy"
            onclick="copier()">

            Copier le lien

        </button>

        <button
            id="openButton"
            class="open"
            onclick="ouvrir()">

            Ouvrir le profil

        </button>

    </div>


    <div class="footer">
        Aucun identifiant ou mot de passe Facebook n'est demandé.
    </div>

</div>


<script>

let finalURL = "";


async function convertir() {

    const input =
        document.getElementById("url");

    const result =
        document.getElementById("result");

    const title =
        document.getElementById("resultTitle");

    const link =
        document.getElementById("finalLink");


    const url =
        input.value.trim();


    if (!url) {

        result.style.display = "block";

        title.innerHTML =
            '<span class="error">Colle un lien Facebook.</span>';

        link.innerText = "";

        return;
    }


    result.style.display = "block";

    title.innerHTML =
        '<div class="loading">Conversion en cours...</div>';

    link.innerText = "";


    try {

        const response =
            await fetch(
                "/api/resolve",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({
                            url: url
                        })
                }
            );


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.error ||
                "Impossible de convertir ce lien."
            );

        }


        finalURL =
            data.final_url;


        title.innerText =
            "Lien permanent :";


        link.innerText =
            finalURL;


    }

    catch (error) {

        finalURL = "";

        title.innerHTML =
            '<span class="error">' +
            error.message +
            '</span>';

        link.innerText = "";

    }

}



async function copier() {

    if (!finalURL)
        return;


    try {

        await navigator.clipboard.writeText(
            finalURL
        );


        const button =
            document.getElementById(
                "copyButton"
            );


        const original =
            button.innerText;


        button.innerText =
            "✓ Lien copié !";


        setTimeout(
            function () {

                button.innerText =
                    original;

            },

            1500
        );


    }

    catch {

        alert(
            "Impossible de copier automatiquement le lien."
        );

    }

}



function ouvrir() {

    if (!finalURL)
        return;


    window.open(
        finalURL,
        "_blank"
    );

}



document
    .getElementById("url")
    .addEventListener(
        "keydown",
        function(event) {

            if (
                event.key === "Enter"
            ) {

                convertir();

            }

        }
    );

</script>


</body>

</html>
