<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Convertisseur Facebook</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    background:#0f172a;
    color:#fff;
    font-family:system-ui;
    min-height:100vh;
    display:grid;
    place-items:center;
    padding:18px
}

main{
    width:min(650px,100%);
    background:#1e293b;
    border-radius:22px;
    padding:24px
}

h1{margin-top:0}

input{
    width:100%;
    padding:16px;
    border:1px solid #475569;
    border-radius:13px;
    background:#0f172a;
    color:#fff;
    font-size:16px
}

button,.open-link{
    width:100%;
    margin-top:12px;
    padding:14px;
    border:0;
    border-radius:13px;
    background:#1877f2;
    color:#fff;
    font-weight:800;
    font-size:16px;
    cursor:pointer
}

.open-link{
    display:block;
    text-align:center;
    text-decoration:none;
}

.help-button{
    background:#334155;
}

#r{
    display:none;
    margin-top:18px;
    padding:15px;
    background:#0f172a;
    border-radius:13px;
    word-break:break-all
}

.warning{
    line-height:1.5;
}

.warning strong{
    color:#fbbf24;
}

.instructions{
    margin-top:16px;
    padding:14px;
    background:#1e293b;
    border-radius:10px;
    font-size:14px;
    line-height:1.5;
}

#appHelp{
    display:none;
    margin-top:12px;
    padding:15px;
    background:#1e293b;
    border-radius:10px;
    font-size:14px;
    line-height:1.5;
}

#appHelp h3{
    margin-top:5px;
}

.muted{
    color:#94a3b8;
    font-size:13px
}
</style>
</head>

<body>

<main>

<h1>Convertisseur Facebook</h1>

<p>Colle un lien Facebook <b>/share/…</b>.</p>

<input id="u" placeholder="https://www.facebook.com/share/...">

<button onclick="go()">Convertir</button>

<div id="r"></div>

<p class="muted">
Aucun identifiant Facebook n'est demandé.
Certains liens nécessitant une connexion Facebook peuvent ne pas être résolus.
</p>

<script>

const esc=s=>s.replace(/[&<>"']/g,c=>({
    '&':'&amp;',
    '<':'&lt;',
    '>':'&gt;',
    '"':'&quot;',
    "'":'&#39;'
}[c]));

function toggleHelp(){

    const help=document.getElementById('appHelp');
    const button=document.getElementById('helpBtn');

    if(help.style.display==='block'){
        help.style.display='none';
        button.textContent="📱 Le lien s'ouvre dans l'application Facebook ?";
    }
    else{
        help.style.display='block';
        button.textContent="Masquer les explications";
    }
}

async function go(){

    const b=document.getElementById('r');
    const input=document.getElementById('u');
    const originalUrl=input.value.trim();

    b.style.display='block';
    b.textContent='Conversion…';

    try{

        let x=await fetch('/api/resolve',{
            method:'POST',
            headers:{
                'Content-Type':'application/json'
            },
            body:JSON.stringify({
                url:originalUrl
            })
        });

        let d=await x.json();

        if(!x.ok)
            throw Error(d.error||'Erreur');

        /* FACEBOOK RENVOIE LOGIN */

        if(
            d.final_url &&
            (
                d.final_url.includes('facebook.com/login') ||
                d.final_url.includes('/login/')
            )
        ){

            b.innerHTML=`
                <div class="warning">

                    <strong>⚠️ Facebook demande une connexion</strong>

                    <p>
                    Le lien n'a pas pu être converti automatiquement.
                    Ouvre-le directement dans ton navigateur.
                    </p>

                    <a
                        class="open-link"
                        href="${esc(originalUrl)}"
                        target="_blank"
                        rel="noopener noreferrer"
                    >
                        Ouvrir le lien Facebook
                    </a>

                    <div class="instructions">

                        <b>Ensuite :</b><br><br>

                        1. Attends que le profil Facebook s'affiche.<br><br>

                        2. Appuie sur la <b>barre d'adresse du navigateur</b>.<br><br>

                        3. <b>Copie le lien affiché dans la barre d'adresse.</b>

                    </div>

                    <button
                        id="helpBtn"
                        class="help-button"
                        onclick="toggleHelp()"
                    >
                        📱 Le lien s'ouvre dans l'application Facebook ?
                    </button>

                    <div id="appHelp">

                        <h3>Si Facebook s'ouvre automatiquement dans l'application</h3>

                        <p>
                        Pour récupérer le lien présent dans la barre d'adresse,
                        il faut ouvrir Facebook dans ton <b>navigateur internet</b>
                        plutôt que dans l'application.
                        </p>

                        <b>🤖 Sur Android</b>

                        <p>
                        Selon ton téléphone :
                        </p>

                        <p>
                        1. Fais un appui long sur le bouton
                        <b>« Ouvrir le lien Facebook »</b>.<br><br>

                        2. Choisis <b>« Ouvrir dans un nouvel onglet »</b>
                        ou <b>« Ouvrir dans le navigateur »</b> si cette option apparaît.<br><br>

                        3. Si Facebook continue à s'ouvrir automatiquement dans
                        l'application, va dans les <b>Paramètres Android</b> →
                        <b>Applications</b> → <b>Facebook</b> →
                        <b>Ouvrir par défaut</b>.<br><br>

                        4. Désactive l'ouverture automatique des
                        <b>liens compatibles</b>.<br><br>

                        5. Reviens sur cette page et ouvre de nouveau le lien.
                        </p>

                        <b>🍎 Sur iPhone / iPad</b>

                        <p>
                        1. Fais un appui long sur
                        <b>« Ouvrir le lien Facebook »</b>.<br><br>

                        2. Choisis <b>« Ouvrir dans un nouvel onglet »</b>
                        lorsque cette option est proposée.<br><br>

                        3. Si Facebook bascule quand même vers l'application,
                        copie le lien puis colle-le directement dans
                        <b>la barre d'adresse de Safari</b>.<br><br>

                        4. Une fois le profil affiché dans Safari,
                        copie l'adresse présente dans la barre d'adresse.
                        </p>

                    </div>

                </div>
            `;

            return;
        }

        /* RESULTAT NORMAL */

        b.innerHTML=
            '<b>Lien final :</b><br>'+
            esc(d.final_url)+
            '<button id="c">Copier</button>';

        document.getElementById('c').onclick=async()=>{

            await navigator.clipboard.writeText(d.final_url);

            document.getElementById('c').textContent='Copié !';
        };

    }
    catch(e){
        b.textContent=e.message;
    }
}

</script>

</main>

</body>
</html>
