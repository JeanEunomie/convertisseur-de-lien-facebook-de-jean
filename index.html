<!doctype html>
<html lang="fr">

<head>

<title>Convertisseur de lien Facebook</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;

    background: #0b1529;
    color: white;

    font-family:
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

    padding: 20px;
}

main {
    width: 100%;
    max-width: 650px;

    background: #1d2a40;

    padding: 30px;

    border-radius: 22px;
}

h1 {
    margin: 0 0 10px;

    font-size: 2.3rem;
    line-height: 1.1;
}

.description {
    color: #bdc7d8;

    font-size: 16px;

    line-height: 1.5;

    margin-bottom: 25px;
}

input {
    width: 100%;

    padding: 16px;

    border-radius: 13px;

    border: 1px solid #526078;

    background: #0d172b;

    color: white;

    font-size: 16px;

    outline: none;
}

input:focus {
    border-color: #1877f2;
}

button {
    width: 100%;

    padding: 15px;

    margin-top: 14px;

    border: none;

    border-radius: 13px;

    background: #1877f2;

    color: white;

    font-size: 16px;

    font-weight: 800;

    cursor: pointer;
}

button:active {
    opacity: 0.8;
}

button:disabled {
    opacity: 0.6;
    cursor: default;
}

#result {
    display: none;

    margin-top: 22px;

    padding: 20px;

    border-radius: 15px;

    background: #0d172b;

    border: 1px solid #3b8f65;
}

.result-title {
    font-size: 19px;

    font-weight: 800;

    margin-bottom: 13px;
}

.result-url {
    padding: 14px;

    background: #162239;

    border-radius: 10px;

    word-break: break-all;

    line-height: 1.5;
}

#error {
    display: none;

    margin-top: 20px;

    padding: 16px;

    border-radius: 13px;

    background: #0d172b;

    border: 1px solid #a77a35;

    color: #e3c993;

    line-height: 1.5;
}

.info {
    margin-top: 22px;

    text-align: center;

    color: #8492a8;

    font-size: 13px;
}

</style>

</head>
